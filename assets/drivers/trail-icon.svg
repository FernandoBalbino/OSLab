<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd4ff"/><stop offset=".55" stop-color="#2b78ff"/><stop offset="1" stop-color="#4f3fd8"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".25" stop-color="#ffffff" stop-opacity="0"/><stop offset=".8" stop-color="#7c5cff" stop-opacity="0"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".55"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfdcff"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#cbd5e1"/><stop offset="1" stop-color="#7b8aa3"/></linearGradient>
    <radialGradient id="led" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e0fdff"/><stop offset=".6" stop-color="#5ff0ff"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1d4ed8" flood-opacity=".45"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".35"/></filter>
  </defs>
  <!-- folha saindo por cima -->
  <g filter="url(#glow)">
    <rect x="76" y="26" width="104" height="86" rx="10" fill="url(#paper)" stroke="#9cc8ff" stroke-width="2"/>
    <path d="M94 48h68M94 64h68M94 80h44" stroke="#6aa8ff" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- corpo da impressora -->
  <g filter="url(#glow)">
    <rect x="24" y="92" width="208" height="108" rx="32" fill="url(#body)"/>
    <rect x="24" y="92" width="208" height="108" rx="32" fill="url(#side)"/>
    <rect x="42" y="99" width="172" height="28" rx="14" fill="#ffffff" opacity=".38"/>
    <rect x="58" y="150" width="140" height="16" rx="8" fill="#1e2a78" opacity=".55"/>
    <circle cx="196" cy="126" r="9" fill="url(#led)"/>
    <circle cx="172" cy="126" r="7" fill="url(#led)" opacity=".8"/>
  </g>
  <!-- folha impressa na frente -->
  <g filter="url(#soft)">
    <path d="M74 158h108l-6 66a8 8 0 0 1-8 7H88a8 8 0 0 1-8-7z" fill="url(#paper)" stroke="#9cc8ff" stroke-width="2"/>
    <rect x="94" y="176" width="16" height="10" rx="3" fill="#22d3ee"/><rect x="114" y="176" width="16" height="10" rx="3" fill="#ec4899"/><rect x="134" y="176" width="16" height="10" rx="3" fill="#facc15"/>
    <path d="M94 200h56M94 214h38" stroke="#6aa8ff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- engrenagem prateada (o driver configurando a impressora) -->
  <g transform="translate(192 190)" filter="url(#soft)">
    <g fill="url(#metal)">
      <rect x="-9" y="-44" width="18" height="88" rx="5"/>
      <rect x="-9" y="-44" width="18" height="88" rx="5" transform="rotate(45)"/>
      <rect x="-9" y="-44" width="18" height="88" rx="5" transform="rotate(90)"/>
      <rect x="-9" y="-44" width="18" height="88" rx="5" transform="rotate(135)"/>
      <circle r="33"/>
    </g>
    <circle r="33" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2"/>
    <circle r="13" fill="#3b5bdb"/>
    <circle r="13" fill="none" stroke="#1e2a78" stroke-opacity=".5" stroke-width="3"/>
    <path d="M-22 -14a27 27 0 0 1 30-14" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8"/>
  </g>
</svg>
