<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ad8ff"/><stop offset=".5" stop-color="#2b78ff"/><stop offset="1" stop-color="#5b3fd8"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fe7ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#cbd5e1"/><stop offset="1" stop-color="#7b8aa3"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1d4ed8" flood-opacity=".45"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".35"/></filter>
    <mask id="notch"><rect x="-40" y="-100" width="80" height="160" fill="#fff"/><rect x="-8" y="-94" width="16" height="30" rx="2" fill="#000"/></mask>
  </defs>
  <!-- alto-falante de vidro -->
  <g filter="url(#glow)">
    <path d="M30 100a14 14 0 0 1 14-14h30l52-40c9-7 22-1 22 11v146c0 12-13 18-22 11l-52-40H44a14 14 0 0 1-14-14z" fill="url(#body)"/>
    <path d="M44 92h28l50-38c5-4 12-1 12 6v20c-30 4-62 8-96 16 0-2 2-4 6-4z" fill="#fff" opacity=".35"/>
  </g>
  <!-- ondas de som -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round" filter="url(#glow)">
    <path d="M170 98c14 16 14 44 0 60" stroke-width="16"/>
    <path d="M196 70c28 30 28 84 0 116" stroke-width="16" opacity=".9"/>
  </g>
  <!-- chave de boca prateada: o técnico consertando -->
  <g transform="translate(184 186) rotate(-40)" filter="url(#soft)">
    <g mask="url(#notch)" fill="url(#metal)"><circle cx="0" cy="-62" r="24"/><rect x="-10" y="-62" width="20" height="100" rx="10"/></g>
    <circle cx="0" cy="26" r="6" fill="#64748b"/>
    <path d="M-4 -40v52" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".75"/>
  </g>
</svg>
